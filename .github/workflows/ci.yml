# Tests on macOS, Linux and Windows for every push to main and every pull request;
# formatting and clippy once (Linux). The simulation tests run against the ngspice the app
# bundles, built from source (cached) on every OS.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  # The simulation tests fail instead of skipping without ngspice (sim::skip_without_ngspice).
  REQUIRE_NGSPICE: 1

jobs:
  lint:
    name: fmt and clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: ./.github/actions/linux-deps
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings

  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - if: runner.os == 'Linux'
        uses: ./.github/actions/linux-deps
      - uses: Swatinem/rust-cache@v2
      # After rust-cache: its post step (cleaning target/) runs after this one saves.
      - uses: ./.github/actions/ngspice
      - run: cargo test --workspace --no-fail-fast
        # A hung test fails the job instead of running for hours (on the step: building
        # ngspice uncached takes a while on Windows).
        timeout-minutes: 30
