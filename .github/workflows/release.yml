# Release builds for macOS (Apple Silicon, ad-hoc signed app), Linux and Windows (x86_64),
# each with the ngspice it bundles (built from source).
# A manual run keeps the archives as workflow artifacts; a version tag (v0.2.0) also
# publishes them as a GitHub Release.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: build (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: macos-arm64, os: macos-latest }
          - { name: linux-x86_64, os: ubuntu-latest }
          - { name: windows-x86_64, os: windows-latest }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - if: runner.os == 'Linux'
        uses: ./.github/actions/linux-deps
      - uses: Swatinem/rust-cache@v2
      - uses: ./.github/actions/ngspice

      - name: Package (macOS)
        if: runner.os == 'macOS'
        run: |
          scripts/bundle-macos.sh
          mkdir dist
          ditto -c -k --keepParent "target/release/bundle/PCB Designer.app" dist/pcb-designer-${{ matrix.name }}.zip
      - name: Package (Linux)
        if: runner.os == 'Linux'
        run: |
          cargo build --release -p app
          # A folder: the binary, ngspice in lib/ (sim::bundled_library), its licence.
          pkg=target/package/pcb-designer
          rm -rf "$pkg" && mkdir -p "$pkg/lib/ngspice"
          cp target/release/pcb-designer "$pkg/"
          # The release profile's line tables are inside the binary on Linux (macOS and
          # Windows keep them beside it): drop them, keep the symbols for backtraces.
          strip --strip-debug "$pkg/pcb-designer"
          ngspice=$(echo target/ngspice/*/)
          cp "$ngspice"lib/libngspice.so.0 "$pkg/lib/"
          cp "$ngspice"lib/ngspice/*.cm "$pkg/lib/ngspice/"
          cp "$ngspice"COPYING "$pkg/ngspice-COPYING.txt"
          mkdir dist
          tar -czf dist/pcb-designer-${{ matrix.name }}.tar.gz -C target/package pcb-designer
      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          cargo build --release -p app
          # A folder: the exe, ngspice.dll and its runtime DLLs beside it, the code models
          # in ngspice\ (sim::bundled_library), its licence.
          $pkg = "target/package/pcb-designer"
          Remove-Item -Recurse -Force $pkg -ErrorAction SilentlyContinue
          New-Item -ItemType Directory "$pkg/ngspice" | Out-Null
          Copy-Item target/release/pcb-designer.exe $pkg
          $ngspice = (Get-ChildItem target/ngspice -Directory)[0].FullName
          Copy-Item "$ngspice/lib/*.dll" $pkg
          Copy-Item "$ngspice/lib/ngspice/*.cm" "$pkg/ngspice"
          Copy-Item "$ngspice/COPYING" "$pkg/ngspice-COPYING.txt"
          New-Item -ItemType Directory dist | Out-Null
          Compress-Archive $pkg dist/pcb-designer-${{ matrix.name }}.zip

      - uses: actions/upload-artifact@v7
        with:
          name: pcb-designer-${{ matrix.name }}
          path: dist/*
          if-no-files-found: error

  publish:
    name: GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" dist/* --repo "${{ github.repository }}" --title "${{ github.ref_name }}" --generate-notes
