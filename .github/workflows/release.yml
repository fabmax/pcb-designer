# Release builds for macOS (Apple Silicon, ad-hoc signed app), Linux and Windows (x86_64).
# A manual run keeps the archives as workflow artifacts; a version tag (v0.2.0) also
# publishes them as a GitHub Release.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: build (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: macos-arm64, os: macos-latest }
          - { name: linux-x86_64, os: ubuntu-latest }
          - { name: windows-x86_64, os: windows-latest }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - if: runner.os == 'Linux'
        uses: ./.github/actions/linux-deps
      - uses: Swatinem/rust-cache@v2

      - name: Package (macOS)
        if: runner.os == 'macOS'
        run: |
          scripts/bundle-macos.sh
          mkdir dist
          ditto -c -k --keepParent "target/release/bundle/PCB Designer.app" dist/pcb-designer-${{ matrix.name }}.zip
      - name: Package (Linux)
        if: runner.os == 'Linux'
        run: |
          cargo build --release -p app
          mkdir dist
          tar -czf dist/pcb-designer-${{ matrix.name }}.tar.gz -C target/release pcb-designer
      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          cargo build --release -p app
          New-Item -ItemType Directory dist | Out-Null
          Compress-Archive target/release/pcb-designer.exe dist/pcb-designer-${{ matrix.name }}.zip

      - uses: actions/upload-artifact@v4
        with:
          name: pcb-designer-${{ matrix.name }}
          path: dist/*
          if-no-files-found: error

  publish:
    name: GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" dist/* --repo "${{ github.repository }}" --title "${{ github.ref_name }}" --generate-notes
