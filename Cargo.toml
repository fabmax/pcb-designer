[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
render = { path = "crates/render" }
spike = { path = "crates/spike" }
model = { path = "crates/model" }
editor-core = { path = "crates/editor-core" }
view = { path = "crates/view" }
mcp = { path = "crates/mcp" }
kicad = { path = "crates/kicad" }
gerber = { path = "crates/gerber" }

eframe = { version = "0.37", default-features = false, features = ["default_fonts", "wgpu", "wayland", "x11", "accesskit", "clipboard"] }
egui = "0.37"
egui-wgpu = "0.37"
egui_tiles = "0.18"
wgpu = "30"
bytemuck = { version = "1", features = ["derive"] }
pollster = "1"
png = "0.18"
rustc-hash = "2"
delaunator = "1"
i_overlay = "9"
i_triangle = "0.51"
smallvec = "1"
log = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order", "float_roundtrip"] }
uuid = { version = "1", features = ["v4", "serde"] }
indexmap = { version = "2", features = ["serde"] }
thiserror = "2"
tempfile = "3"
rstar = "0.14"
rfd = "0.18"
arboard = { version = "3", default-features = false }
schemars = { version = "1.0", features = ["derive", "uuid1"] }
rmcp = { version = "3.9", default-features = false, features = ["server", "macros", "base64", "transport-streamable-http-server", "transport-io"] }
tokio = { version = "1", features = ["rt-multi-thread", "net", "sync", "time", "macros"] }
tokio-util = "0.7"
axum = { version = "0.8", default-features = false, features = ["http1", "tokio"] }
base64 = "0.22"
env_logger = "0.11"
ureq = "3"
flate2 = "1"
tar = "0.4"

[profile.dev.package."*"]
opt-level = 2

[profile.release]
debug = "line-tables-only"
