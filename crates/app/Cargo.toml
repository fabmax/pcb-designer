[package]
name = "app"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "PCB Designer desktop application"

[[bin]]
name = "pcb-designer"
path = "src/main.rs"

[dependencies]
render.workspace = true
view.workspace = true
mcp.workspace = true
model.workspace = true
editor-core.workspace = true
rfd.workspace = true
arboard.workspace = true
eframe.workspace = true
egui.workspace = true
egui-wgpu.workspace = true
egui_tiles.workspace = true
wgpu.workspace = true
log.workspace = true
rustc-hash.workspace = true
serde.workspace = true
serde_json.workspace = true
env_logger.workspace = true
kicad.workspace = true

[dev-dependencies]
tempfile.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
muda = { version = "0.21", default-features = false }
winit = { version = "0.30", default-features = false }
raw-window-handle = "0.6"
objc2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSString", "NSUserDefaults", "NSGeometry"] }
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSView", "NSWindow", "NSResponder", "NSButton", "NSControl"] }
