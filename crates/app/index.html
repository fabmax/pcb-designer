<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>PCB Designer</title>
    <link data-trunk rel="rust" data-bin="pcb-designer" data-wasm-opt="z" data-initializer="loading.mjs">
    <link data-trunk rel="icon" href="assets/icon.png">
    <style>
        html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #1e1f22; }
        #pcb_designer_canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; display: block; }
        #loading { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
                   flex-direction: column; gap: 12px; color: #a0a4ab; font: 15px system-ui, sans-serif;
                   font-variant-numeric: tabular-nums; }
        #loading p { margin: 0; }
        #loading-track { width: 280px; height: 4px; border-radius: 2px; background: #2a2e36; overflow: hidden; }
        #loading-bar { width: 0; height: 100%; background: #4c9aff; transition: width 0.1s; }
    </style>
</head>
<body>
    <canvas id="pcb_designer_canvas"></canvas>
    <div id="loading">
        <p id="loading-text">Loading PCB Designer…</p>
        <div id="loading-track"><div id="loading-bar"></div></div>
    </div>
</body>
</html>
