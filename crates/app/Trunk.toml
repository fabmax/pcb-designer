# The browser build: `trunk serve` (or `trunk build --release`) in this folder.
[build]
target = "index.html"
dist = "../../target/web"

# ngspice for simulation (built with Emscripten when it's installed).
[[hooks]]
stage = "post_build"
command = "sh"
command_arguments = ["../../scripts/web-ngspice.sh"]

# The real wasm size for the loading progress (Trunk records it before wasm-opt).
[[hooks]]
stage = "post_build"
command = "sh"
command_arguments = ["../../scripts/web-wasm-size.sh"]
